name: E2E - OP Historical Proof

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Run E2E tests (OP historical proof)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          # Ensure foundry binaries are in PATH for the rest of the job
          source $HOME/.bashrc
          foundryup || true

      - name: Verify tools
        run: |
          echo "forge: $(command -v forge || true)"
          echo "anvil: $(command -v anvil || true)"
          go version

      - name: Build contract artifacts with forge
        working-directory: crates/optimism/tests/proofs/contracts
        run: |
          forge build

      - name: Run DEVNET
        working-directory: crates/optimism/tests
        env:
          DEVNET: destruct-historical-proof
        run: |
          make all

      - name: Run E2E kurtosis tests
        working-directory: crates/optimism/tests
        run: |
          make test-e2e-kurtosis